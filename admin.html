<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | FABBY'S CAKES</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3E3F7;--card:#fff;--dark:#3B1751;--muted:#6f5a80;--accent:#E84393;--accent-d:#C42D74;--gold:#E8C77D;--line:#EAD9F5;--r:6px;
--display:'Fraunces',Georgia,serif;--body:'Work Sans',system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--dark);line-height:1.5}
h1,h2,h3{font-family:var(--display);font-weight:600;margin:0 0 .4em;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{border:2px solid transparent;border-radius:var(--r);padding:9px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:#fff}
.btn:hover{background:var(--accent-d)}
.btn.ghost{background:transparent;border-color:var(--dark);color:var(--dark)}
.btn.ghost:hover{background:var(--dark);color:#fff}
.btn.sm{padding:5px 11px;font-size:.85rem}
.btn.del{background:transparent;border-color:#b3261e;color:#b3261e}
.btn.del:hover{background:#b3261e;color:#fff}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:5px}
.field{margin-bottom:14px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.hidden{display:none!important}
.hint{color:var(--muted);margin:-6px 0 16px}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-box{background:var(--card);border-radius:var(--r);padding:34px;width:100%;max-width:380px;border:1px solid var(--line)}
.err{color:#b3261e;font-size:.9rem;min-height:1.3em;margin:6px 0 0}
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--dark);color:#F9EAF4;padding:26px 16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
aside .logo{font-family:var(--display);font-size:1.25rem;margin:0 8px 18px;color:#fff}
aside .logo small{display:block;font-family:var(--body);font-size:.8rem;color:var(--gold)}
.tab{background:none;border:0;text-align:left;padding:11px 12px;border-radius:var(--r);cursor:pointer;color:#F9EAF4;font-weight:500;display:flex;justify-content:space-between}
.tab:hover{background:rgba(255,255,255,.1)}
.tab.on{background:var(--accent);color:#fff}
.badge{background:var(--gold);color:var(--dark);border-radius:20px;padding:0 8px;font-size:.8rem;font-weight:600}
aside .spacer{flex:1}
aside a,aside .out{color:#F9EAF4;font-size:.9rem;padding:8px 12px;background:none;border:0;text-align:left;cursor:pointer;text-decoration:none}
main{padding:34px 38px;max-width:1000px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.top h2{font-size:1.9rem;margin:0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:26px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem}
.stat span{color:var(--muted);font-size:.88rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:20px}
.tbl{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}
.tbl th{text-align:left;font-size:.85rem;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl select{padding:5px 8px;width:auto}
.scroll{overflow-x:auto}
.empty{background:var(--card);border:1px dashed var(--muted);border-radius:var(--r);padding:30px;text-align:center;color:var(--muted)}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.82rem;font-weight:600}
.s-New{background:#FCE7F2;color:var(--accent-d)}.s-Baking{background:#FFF1C7;color:#7a5a00}
.s-Ready{background:#E7F5EF;color:#0b6b52}.s-Delivered{background:var(--line);color:var(--dark)}.s-Cancelled{background:#eee;color:#777}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters button{border:1px solid var(--dark);background:transparent;border-radius:20px;padding:4px 14px;cursor:pointer}
.filters button.on{background:var(--dark);color:#fff}
.flav{display:flex;flex-wrap:wrap;gap:10px}
.flav span{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 6px 5px 16px;font-weight:500}
.flav button{border:0;background:var(--line);border-radius:50%;width:24px;height:24px;cursor:pointer;margin-left:4px;font-size:1rem;line-height:1}
.slot{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.thumb{aspect-ratio:16/6;border-radius:var(--r);background:var(--line) center/cover;display:grid;place-items:center;color:var(--muted);font-size:.9rem}
dialog{border:0;border-radius:var(--r);padding:26px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(59,23,81,.55)}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 20px;border-radius:var(--r);opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
@media(max-width:820px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:14px}
aside .logo{width:100%;margin-bottom:6px}aside .spacer{display:none}main{padding:22px 16px}.stats{grid-template-columns:1fr 1fr}.row,.slot{grid-template-columns:1fr}}
</style>
</head>
<body>

<section id="login">
  <form class="login-box" id="loginForm">
    <h1>FABBY'S CAKES</h1>
    <p style="color:var(--muted);margin-top:0">Sign in to manage your cakes, photos and orders.</p>
    <div class="field"><label for="pw">Passcode</label><input id="pw" type="password" autocomplete="current-password" required></div>
    <p class="err" id="loginErr" role="alert"></p>
    <button class="btn" style="width:100%">Sign in</button>
  </form>
</section>

<div id="app" class="hidden">
  <aside>
    <div class="logo">FABBY'S CAKES<small>Admin panel</small></div>
    <button class="tab on" data-view="overview">Overview</button>
    <button class="tab" data-view="orders">Orders <span class="badge" id="newCount">0</span></button>
    <button class="tab" data-view="cakes">Cakes</button>
    <button class="tab" data-view="flavours">Flavours</button>
    <button class="tab" data-view="slider">Home slider</button>
    <div class="spacer"></div>
    <a href="index.html">View website</a>
    <small style="padding:0 12px;color:#cdb8dc">Always open the website with this link so it shows your changes.</small>
    <button class="out" id="logout">Sign out</button>
  </aside>
  <main id="view"></main>
</div>

<dialog id="cakeDlg">
  <form id="cakeForm" method="dialog">
    <h3 id="cakeTitle">Add a cake</h3>
    <div class="field"><label for="cName">Cake name</label><input id="cName" required></div>
    <div class="row">
      <div class="field"><label for="cCat">Type of cake</label>
        <select id="cCat"><option>Birthday</option><option>Wedding</option><option>Graduation</option><option>Custom made</option></select></div>
      <div class="field"><label for="cPrice">Price (KES)</label><input id="cPrice" type="number" min="0" required></div>
    </div>
    <div class="field"><label for="cDesc">Description</label><textarea id="cDesc" rows="2"></textarea></div>
    <div class="field"><label style="display:flex;gap:8px;align-items:center;font-weight:500"><input type="checkbox" id="cFeat" style="width:auto"> Show this cake on the home page</label></div>
    <div class="field"><label>Cake photo</label>
      <div style="display:flex;gap:12px;align-items:center">
        <img id="photoPrev" alt="" style="width:90px;height:68px;object-fit:cover;border-radius:6px;background:var(--line)" hidden>
        <div><label class="btn ghost sm" for="cFile" style="display:inline-block;cursor:pointer;margin:0">Choose photo</label>
        <input id="cFile" type="file" accept="image/*" hidden>
        <button type="button" class="btn sm del" id="photoDel" hidden>Remove photo</button></div>
      </div></div>
    <div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save cake</button></div>
  </form>
</dialog>

<dialog id="orderDlg">
  <form id="adminOrderForm" method="dialog">
    <h3>Add an order</h3>
    <div class="row">
      <div class="field"><label for="oName">Customer name</label><input id="oName" required></div>
      <div class="field"><label for="oPhone">Phone</label><input id="oPhone" type="tel"></div>
    </div>
    <div class="field"><label for="oItem">Cake</label><input id="oItem" list="cakeList" required><datalist id="cakeList"></datalist></div>
    <div class="row">
      <div class="field"><label for="oDate">Needed on</label><input id="oDate" type="date" required></div>
      <div class="field"><label for="oTotal">Total (KES)</label><input id="oTotal" type="number" min="0" required></div>
    </div>
    <div class="field"><label for="oNotes">Notes (flavour, message, delivery)</label><textarea id="oNotes" rows="2"></textarea></div>
    <div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn">Save order</button></div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script src="script.js"></script>
<script>
/* uses the shared helpers and data from script.js */
const PASSCODE = 'fabby2026'; /* change this */
const AUTH = 'fabby_admin_ok';
const STATUSES = ['New', 'Baking', 'Ready', 'Delivered', 'Cancelled'];
let orders = load('fabby_orders', []);
let view = 'overview', filter = 'All', editingId = null, curImg = '';
const nextId = l => l.reduce((m, x) => Math.max(m, x.id || 0), 0) + 1;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600); }
function stored(ok) { if (!ok) toast('Could not save. The browser storage is full or blocked. Try smaller photos.'); return ok; }

/* sign in */
function showApp() { $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); render(); }
$('#loginForm').addEventListener('submit', e => {
  e.preventDefault();
  if ($('#pw').value === PASSCODE) { try { sessionStorage.setItem(AUTH, '1'); } catch (_) { } showApp(); }
  else $('#loginErr').textContent = 'Wrong passcode. Try again.';
});
$('#logout').onclick = () => { try { sessionStorage.removeItem(AUTH); } catch (_) { } location.reload(); };
try { if (sessionStorage.getItem(AUTH)) showApp(); } catch (_) { }

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  view = b.dataset.view;
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  render();
});

function render() {
  $('#newCount').textContent = orders.filter(o => o.status === 'New').length;
  $('#view').innerHTML = { overview: overviewView, orders: ordersView, cakes: cakesView, flavours: flavoursView, slider: sliderView }[view]();
  $('#cakeList').innerHTML = cakes.map(c => `<option value="${esc(c.name)}">`).join('');
}

function overviewView() {
  const open = orders.filter(o => ['New', 'Baking', 'Ready'].includes(o.status));
  const rev = orders.filter(o => o.status === 'Delivered').reduce((s, o) => s + Number(o.total), 0);
  const up = open.slice().sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5);
  return `<div class="top"><h2>Overview</h2></div>
  <div class="stats">
    <div class="stat"><b>${orders.filter(o => o.status === 'New').length}</b><span>New orders</span></div>
    <div class="stat"><b>${open.length}</b><span>Open orders</span></div>
    <div class="stat"><b>${kes(rev)}</b><span>Revenue (delivered)</span></div>
    <div class="stat"><b>${cakes.length}</b><span>Cakes on menu</span></div>
  </div>
  <div class="panel"><h3>Next to bake</h3>
  ${up.length ? `<div class="scroll"><table class="tbl"><tr><th>Needed on</th><th>Customer</th><th>Cake</th><th>Status</th></tr>
  ${up.map(o => `<tr><td>${esc(o.date)}</td><td>${esc(o.name)}</td><td>${esc(o.item)}</td><td><span class="pill s-${o.status}">${o.status}</span></td></tr>`).join('')}</table></div>`
    : '<p style="color:var(--muted);margin:0">Nothing to bake yet.</p>'}</div>`;
}

/* orders */
function ordersView() {
  const list = orders.filter(o => filter === 'All' || o.status === filter).sort((a, b) => a.date.localeCompare(b.date));
  return `<div class="top"><h2>Orders</h2><div style="display:flex;gap:10px"><button class="btn ghost" onclick="exportCSV()">Export CSV</button><button class="btn" onclick="openOrder()">Add order</button></div></div>
  <div class="filters">${['All', ...STATUSES].map(s => `<button class="${s === filter ? 'on' : ''}" onclick="setFilter('${s}')">${s}</button>`).join('')}</div>
  ${list.length ? `<div class="scroll"><table class="tbl"><tr><th>Needed on</th><th>Customer</th><th>Cake</th><th>Total</th><th>Status</th><th></th></tr>
  ${list.map(o => `<tr><td>${esc(o.date)}</td><td><b>${esc(o.name)}</b><br><small style="color:var(--muted)">${esc(o.phone || '')}</small></td>
  <td>${esc(o.item)}${o.notes ? `<br><small style="color:var(--muted)">${esc(o.notes)}</small>` : ''}</td><td>${kes(o.total)}</td>
  <td><select aria-label="Status for ${esc(o.name)}" onchange="setStatus(${o.id},this.value)">${STATUSES.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td>
  <td><button class="btn sm del" onclick="delOrder(${o.id})">Delete</button></td></tr>`).join('')}</table></div>`
    : `<div class="empty">${orders.length ? 'No orders with this status.' : 'No orders yet. Add one with the button above.'}</div>`}`;
}
function setFilter(f) { filter = f; render(); }
function setStatus(id, s) { orders.find(o => o.id === id).status = s; save('fabby_orders', orders); render(); toast('Order marked ' + s); }
function delOrder(id) { if (!confirm('Delete this order?')) return; orders = orders.filter(o => o.id !== id); save('fabby_orders', orders); render(); toast('Order deleted'); }
function openOrder() { $("#adminOrderForm").reset(); $('#orderDlg').showModal(); }
$("#adminOrderForm").addEventListener('submit', () => {
  orders.push({ id: nextId(orders), name: $('#oName').value.trim(), phone: $('#oPhone').value.trim(), item: $('#oItem').value.trim(), date: $('#oDate').value,
    total: Number($('#oTotal').value), notes: $('#oNotes').value.trim(), status: 'New', created: new Date().toISOString() });
  save('fabby_orders', orders); render(); toast('Order added');
});
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const csv = [['Date needed', 'Customer', 'Phone', 'Cake', 'Total', 'Status', 'Notes'].map(q).join(',')]
    .concat(orders.map(o => [o.date, o.name, o.phone, o.item, o.total, o.status, o.notes].map(q).join(','))).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' })); a.download = 'fabbys-orders.csv'; a.click();
}

/* cakes */
function cakesView() {
  return `<div class="top"><h2>Cakes</h2><button class="btn" onclick="openCake()">Add cake</button></div>
  <p class="hint">Add a cake, pick its type and photo, and save. It shows on your website straight away.</p>
  ${cakes.length ? `<div class="scroll"><table class="tbl"><tr><th>Cake</th><th>Type</th><th>Price</th><th></th></tr>
  ${cakes.map(c => `<tr><td><div style="display:flex;gap:12px;align-items:center">${c.img ? `<img src="${esc(c.img)}" alt="" style="width:56px;height:42px;object-fit:cover;border-radius:4px">` : ''}<div><b>${esc(c.name)}</b>${c.featured ? ' <span class="pill s-Ready">Home page</span>' : ''}<br><small style="color:var(--muted)">${esc(c.desc)}</small></div></div></td>
  <td>${esc(c.cat)}</td><td>${kes(c.price)}</td>
  <td style="white-space:nowrap"><button class="btn sm ghost" onclick="openCake(${c.id})">Edit</button> <button class="btn sm del" onclick="delCake(${c.id})">Delete</button></td></tr>`).join('')}</table></div>`
    : '<div class="empty">Your menu is empty. Add your first cake.</div>'}`;
}
function updatePrev() { const p = $('#photoPrev'); p.hidden = !curImg; if (curImg) p.src = curImg; $('#photoDel').hidden = !curImg; }
function openCake(id) {
  editingId = id || null; $('#cakeForm').reset(); curImg = ''; $('#cFeat').checked = true;
  $('#cakeTitle').textContent = id ? 'Edit cake' : 'Add a cake';
  if (id) { const c = cakes.find(x => x.id === id); $('#cName').value = c.name; $('#cCat').value = c.cat; $('#cPrice').value = c.price; $('#cDesc').value = c.desc; curImg = c.img || ''; $('#cFeat').checked = !!c.featured; }
  updatePrev(); $('#cakeDlg').showModal();
}
$('#cakeForm').addEventListener('submit', () => {
  const data = { name: $('#cName').value.trim(), cat: $('#cCat').value, price: Number($('#cPrice').value), desc: $('#cDesc').value.trim(), img: curImg, featured: $('#cFeat').checked };
  if (editingId) Object.assign(cakes.find(c => c.id === editingId), data); else cakes.push({ id: nextId(cakes), ...data });
  if (stored(save('fabby_cakes', cakes))) toast('Cake saved. Refresh your website to see it.');
  render();
});
function delCake(id) { if (!confirm('Remove this cake from the menu?')) return; cakes = cakes.filter(c => c.id !== id); save('fabby_cakes', cakes); render(); toast('Cake removed'); }
$('#cFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { curImg = await shrink(f); updatePrev(); } catch (_) { toast('Could not read that photo. Try a JPG or PNG.'); }
  e.target.value = '';
};
$('#photoDel').onclick = () => { curImg = ''; updatePrev(); };

/* flavours */
function flavoursView() {
  return `<div class="top"><h2>Flavours</h2></div>
  <p class="hint">These show on your website and in the order form.</p>
  <form class="panel" onsubmit="addFlavour(event)" style="display:flex;gap:10px"><input id="fNew" placeholder="Type a flavour, e.g. Banana" aria-label="New flavour" required><button class="btn">Add</button></form>
  <div class="flav">${flavours.map((f, i) => `<span>${esc(f)}<button aria-label="Remove ${esc(f)}" onclick="delFlavour(${i})">&times;</button></span>`).join('') || '<div class="empty">No flavours yet. Add your first one above.</div>'}</div>`;
}
function addFlavour(e) {
  e.preventDefault(); const v = $('#fNew').value.trim();
  if (v && !flavours.some(x => x.toLowerCase() === v.toLowerCase())) { flavours.push(v); save('fabby_flavours', flavours); toast('Flavour added'); }
  render();
}
function delFlavour(i) { flavours.splice(i, 1); save('fabby_flavours', flavours); render(); toast('Flavour removed'); }

/* home slider */
function sliderView() {
  return `<div class="top"><h2>Home slider</h2></div>
  <p class="hint">The 3 pictures that slide at the top of your home page. Use wide (landscape) photos of your best cakes.</p>
  ${slides.map((s, i) => `<div class="panel slot"><div class="thumb" style="${s.img ? `background-image:url('${s.img}')` : ''}">${s.img ? '' : 'No photo yet'}</div>
  <div><h3>Slide ${i + 1}</h3>
  <div class="field"><label for="st${i}">Headline on the picture</label><input id="st${i}" value="${esc(s.title)}" placeholder="${esc(SLIDE_DEFAULTS[i].t)}" onchange="setSlideTitle(${i},this.value)"></div>
  <label class="btn ghost sm" for="sf${i}" style="display:inline-block;cursor:pointer;margin:0">${s.img ? 'Change photo' : 'Choose photo'}</label>
  <input type="file" accept="image/*" id="sf${i}" data-slot="${i}" hidden>
  ${s.img ? `<button class="btn sm del" onclick="delSlide(${i})">Remove photo</button>` : ''}</div></div>`).join('')}`;
}
function setSlideTitle(i, v) { slides[i].title = v.trim(); save('fabby_slides', slides); toast('Headline saved'); }
function delSlide(i) { slides[i].img = ''; save('fabby_slides', slides); render(); toast('Photo removed'); }
document.addEventListener('change', async e => {
  if (e.target.dataset.slot === undefined) return;
  const f = e.target.files[0]; if (!f) return; const i = +e.target.dataset.slot;
  try { slides[i].img = await shrink(f, 1400, 0.8); if (stored(save('fabby_slides', slides))) toast('Slide photo saved. Refresh your website to see it.'); render(); }
  catch (_) { toast('Could not read that photo. Try a JPG or PNG.'); }
});

document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
</script>
</body>
</html>
